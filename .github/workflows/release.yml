name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify tag, package, and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/agora-etl-plugins/
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match package version {version!r}. "
                  f"Expected {expected_tag!r}."
              )
          print(f"Validated release tag {release_tag}.")
          PY

      - name: Setup environment
        env:
          BOOTSTRAP_PYTHON: python
        run: make setup

      - name: Build and verify the release package
        env:
          BOOTSTRAP_PYTHON: python
        run: make verify-package

      - name: Publish the verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
