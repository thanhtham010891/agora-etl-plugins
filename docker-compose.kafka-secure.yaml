services:
  kafka-secure:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19093:9093"
      - "19094:9094"
    volumes:
      - ./.docker/kafka-secure:/etc/kafka/secrets
      - kafka_secure_data:/var/lib/kafka/data
    command:
      - /bin/bash
      - -lc
      - |
        test -f /etc/kafka/secrets/server.properties
        kafka-storage format --ignore-formatted -t "$$CLUSTER_ID" -c /etc/kafka/secrets/server.properties
        exec kafka-server-start /etc/kafka/secrets/server.properties
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9094 --command-config /etc/kafka/secrets/client-mtls.properties >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-secure-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka-secure:
        condition: service_healthy
    environment:
      KAFKA_SCRAM_USERNAME: ${KAFKA_SCRAM_USERNAME:-agora}
      KAFKA_SCRAM_PASSWORD: ${KAFKA_SCRAM_PASSWORD:-agora-scram-secret}
    volumes:
      - ./.docker/kafka-secure:/etc/kafka/secrets
    entrypoint:
      - /bin/bash
      - -lc
      - |
        kafka-configs \
          --bootstrap-server kafka-secure:29094 \
          --command-config /etc/kafka/secrets/client-mtls.properties \
          --alter \
          --entity-type users \
          --entity-name "$$KAFKA_SCRAM_USERNAME" \
          --add-config "SCRAM-SHA-256=[password=$$KAFKA_SCRAM_PASSWORD]"
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    restart: unless-stopped
    depends_on:
      kafka-secure:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: SSL://kafka-secure:29094
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SSL
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /etc/schema-registry/secrets/client.truststore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_CERT_STORE_PASSWORD:-changeit}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_TYPE: PKCS12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_LOCATION: /etc/schema-registry/secrets/client.keystore.p12
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEYSTORE_PASSWORD: ${KAFKA_CERT_STORE_PASSWORD:-changeit}
      SCHEMA_REGISTRY_KAFKASTORE_SSL_KEY_PASSWORD: ${KAFKA_CERT_STORE_PASSWORD:-changeit}
    volumes:
      - ./.docker/kafka-secure:/etc/schema-registry/secrets
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/subjects >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  schema-registry-secure:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_BASIC_AUTH_USERNAME: ${SCHEMA_REGISTRY_BASIC_AUTH_USERNAME:-agora}
      SCHEMA_REGISTRY_BASIC_AUTH_PASSWORD: ${SCHEMA_REGISTRY_BASIC_AUTH_PASSWORD:-agora-registry-secret}
    ports:
      - "18081:8443"
      - "18443:8444"
    volumes:
      - ./.docker/kafka-secure:/etc/nginx/secrets:ro
      - ./.docker/kafka-secure/schema-registry-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "AUTH=$$(printf '%s' \"$$SCHEMA_REGISTRY_BASIC_AUTH_USERNAME:$$SCHEMA_REGISTRY_BASIC_AUTH_PASSWORD\" | base64 | tr -d '\\n'); wget -q -O - --no-check-certificate --header=\"Authorization: Basic $$AUTH\" https://127.0.0.1:8443/subjects >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

volumes:
  kafka_secure_data:
