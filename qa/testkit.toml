[topologies.base]
description = "Local Redis, Kafka, and Postgres integration stack"
up = [
  ["docker", "compose", "-f", "docker-compose.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.yaml", "down", "-v", "--remove-orphans"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.yaml", "ps"],
]

[topologies.kafka_cluster]
description = "Three-broker Kafka cluster topology"
up = [
  ["docker", "compose", "-f", "docker-compose.kafka-cluster.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.kafka-cluster.yaml", "down", "-v", "--remove-orphans"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.kafka-cluster.yaml", "ps"],
]

[topologies.kafka_secure]
description = "Secure Kafka and Schema Registry topology"
up = [
  ["{python}", "scripts/security/generate_assets.py", "kafka-secure"],
  ["docker", "compose", "-f", "docker-compose.kafka-secure.yaml", "up", "-d", "--wait", "--force-recreate", "kafka-secure", "schema-registry", "schema-registry-secure"],
  ["docker", "compose", "-f", "docker-compose.kafka-secure.yaml", "run", "--rm", "kafka-secure-init"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.kafka-secure.yaml", "down", "-v", "--remove-orphans"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.kafka-secure.yaml", "ps"],
]

[topologies.postgres_ha]
description = "Postgres HA failover topology"
up = [
  ["docker", "compose", "-f", "docker-compose.postgres-ha.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.postgres-ha.yaml", "down", "-v", "--remove-orphans"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.postgres-ha.yaml", "ps"],
]

[topologies.redis_sentinel]
description = "Redis Sentinel failover topology"
up = [
  ["docker", "compose", "-f", "docker-compose.redis-sentinel.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.redis-sentinel.yaml", "down", "-v"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.redis-sentinel.yaml", "ps"],
]

[topologies.redis_secure]
description = "Redis TLS and ACL topology"
up = [
  ["{python}", "scripts/security/generate_assets.py", "redis-secure"],
  ["docker", "compose", "-f", "docker-compose.redis-secure.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.redis-secure.yaml", "down", "-v"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.redis-secure.yaml", "ps"],
]

[topologies.redis_cluster]
description = "Redis Cluster topology"
up = [
  ["docker", "compose", "-f", "docker-compose.redis-cluster.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.redis-cluster.yaml", "down", "-v"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.redis-cluster.yaml", "ps"],
]

[topologies.redis_stack]
description = "Redis Stack with RediSearch"
up = [
  ["docker", "compose", "-f", "docker-compose.redis-stack.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.redis-stack.yaml", "down", "-v"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.redis-stack.yaml", "ps"],
]

[topologies.s3]
description = "MinIO-backed S3 topology"
up = [
  ["docker", "compose", "-f", "docker-compose.s3-minio.yaml", "up", "-d", "minio"],
  ["docker", "compose", "-f", "docker-compose.s3-minio.yaml", "run", "--rm", "minio-init"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.s3-minio.yaml", "down", "-v", "--remove-orphans"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.s3-minio.yaml", "ps"],
]

[topologies.redis_redlock]
description = "Three independent Redis masters for Redlock tests"
up = [
  ["docker", "compose", "-f", "docker-compose.redis-redlock.yaml", "up", "-d", "--wait"],
]
down = [
  ["docker", "compose", "-f", "docker-compose.redis-redlock.yaml", "down", "-v"],
]
status = [
  ["docker", "compose", "-f", "docker-compose.redis-redlock.yaml", "ps"],
]

[suites.integration_full]
description = "Run the broad integration suite against the base stack"
env_group = "base"
topologies = ["base"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration", "-q"],
]

[suites.kafka_redis_wedge]
description = "Kafka to Redis wedge slice"
env_group = "base"
topologies = ["base"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/test_kafka_redis_wedge.py", "-q", "-vv", "-rs", "-s"],
]

[suites.kafka_secure]
description = "Secure Kafka and Schema Registry integration tests"
env_group = "kafka_secure"
topologies = ["kafka_secure"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/kafka/test_kafka_secure_integration.py", "-q"],
]

[suites.kafka_secure_schema_failure_matrix]
description = "Secure Kafka schema failure-path matrix"
env_group = "kafka_secure"
topologies = ["kafka_secure"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/kafka/test_kafka_secure_integration.py", "-k", "json_schema_failure_path or protobuf_failure_path", "-q", "-vv", "-rs", "-s"],
]

[suites.postgres_ha_failover]
description = "Postgres HA failover reconnect and resume slice"
env_group = "postgres_ha"
topologies = ["base", "postgres_ha"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/postgres/test_postgres_integration.py", "-k", "ha_failover", "-q", "-vv", "-rs", "-s"],
]

[suites.postgres_ha_replica_routing]
description = "Postgres HA replica routing and staleness guard slice"
env_group = "postgres_ha"
topologies = ["base", "postgres_ha"]
topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/postgres/test_postgres_integration.py", "-k", "standby_route_fail_closes_when_replica_is_stale or prefer_standby_falls_back_to_primary_across_multi_cycle_failover", "-q", "-vv", "-rs", "-s"],
]

[suites.kafka_postgres_ha_failover]
description = "Kafka to Postgres HA failover wedge slice"
env_group = "kafka_postgres_ha"
topologies = ["base", "postgres_ha"]
topology_policy = "recreate"
