topology_policy = "recreate"
commands = [
  [".venv/bin/pytest", "tests/integration/kafka/test_kafka_secure_integration.py", "-k", "avro_round_trip or avro_round_trip_over_secure_schema_registry_mtls or json_schema_round_trip or json_schema_failure_path or protobuf_round_trip or protobuf_failure_path or schema_registry_mtls_rejects_client_without_certificate or schema_registry_mtls_rejects_client_with_untrusted_certificate or schema_registry_auth_failures_are_rejected_clearly", "-q", "-vv", "-rs", "-s"],
]

[suites.wheel_release_gate]
description = "Installed wheel and import consistency gate"
commands = [
  ["make", "test-release-gate-wheel"],
]

[gates.release_base]
description = "Base Kafka and Redis release gate"
suites = ["kafka_redis_wedge"]

[gates.release_postgres]
description = "Postgres HA and Kafka/Postgres release gate"
suites = ["postgres_ha_failover", "postgres_ha_replica_routing", "kafka_postgres_ha_failover"]

[gates.release_kafka_secure]
description = "Secure Kafka and Schema Registry release gate"
suites = ["kafka_secure_enterprise_matrix"]

[gates.release_kafka_cluster]
description = "Kafka cluster failover and replay release gate"
suites = ["kafka_cluster_enterprise"]

[gates.release_redis]
description = "Redis secure, enterprise topology, and Redlock release gate"
suites = ["redis_secure_matrix", "redis_enterprise_matrix", "redis_redlock"]

[gates.release_bigquery]
description = "BigQuery dataset and Storage Write release gate"
suites = ["bigquery_enterprise"]

[gates.release_s3]
description = "S3 dataset release gate"
suites = ["s3_integration"]

[matrices.periodic]
description = "Nightly periodic integration matrix"
lanes = ["wheel", "base", "postgres", "kafka-secure", "kafka-cluster", "s3", "bigquery", "redis-secure", "redis-enterprise", "redis-redlock"]

[matrix_lanes.periodic.wheel]
label = "Wheel/import consistency gate"
kind = "suite"
target = "wheel_release_gate"

[matrix_lanes.periodic.base]
label = "Base Kafka/Redis/Postgres stack gate"
kind = "gate"
target = "release_base"

[matrix_lanes.periodic.postgres]
label = "Postgres HA + Kafka/Postgres wedge gate"
kind = "gate"
target = "release_postgres"

[matrix_lanes.periodic.kafka-secure]
label = "Secure Kafka/schema-registry gate"
kind = "gate"
target = "release_kafka_secure"

[matrix_lanes.periodic.kafka-cluster]
label = "Kafka cluster failover/replay gate"
kind = "gate"
target = "release_kafka_cluster"

[matrix_lanes.periodic.s3]
label = "S3 dataset MinIO gate"
kind = "gate"
target = "release_s3"

[matrix_lanes.periodic.bigquery]
label = "BigQuery local GA dataset + Storage Write gate"
kind = "gate"
target = "release_bigquery"
skip_if_missing_env = ["INTEGRATION_BIGQUERY_PROJECT", "INTEGRATION_BIGQUERY_DATASET"]

[matrix_lanes.periodic.redis-secure]
label = "Redis secure gate"
kind = "suite"
target = "redis_secure_matrix"

[matrix_lanes.periodic.redis-enterprise]
label = "Redis enterprise topology gate"
kind = "suite"
target = "redis_enterprise_matrix"

[matrix_lanes.periodic.redis-redlock]
label = "Redis Redlock quorum gate"
kind = "suite"
target = "redis_redlock"
