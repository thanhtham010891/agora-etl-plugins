[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agora-etl-plugins"
version = "0.4.2"
description = "Official plugins for agora-etl — Redis, Kafka, PostgreSQL, BigQuery, S3, cron scheduling, distributed coordination, and Anthropic AI support."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["etl", "pipeline", "async", "kafka", "postgres", "redis", "bigquery", "s3", "cron", "distributed", "anthropic", "llm", "data-engineering"]
authors = [
    { name = "Tham Tra" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "agora-etl>=0.4.5,<1",
]

[project.urls]
Homepage = "https://github.com/thanhtham010891/agora-etl-plugins"
Documentation = "https://github.com/thanhtham010891/agora-etl/blob/main/docs/plugins/index.md"
Repository = "https://github.com/thanhtham010891/agora-etl-plugins"
BugTracker = "https://github.com/thanhtham010891/agora-etl-plugins/issues"

[project.optional-dependencies]
redis = [
    "redis>=7.0,<8",
]
cron = [
    "croniter>=6.0,<7",
]
distributed = [
    "redis>=7.0,<8",
]
kafka = [
    "aiokafka>=0.11,<1",
    "fastavro>=1.9,<2",
    "jsonschema>=4.0,<5",
    "protobuf>=5,<7",
]
postgres = [
    "psycopg[binary]>=3.1,<4",
    "psycopg_pool>=3.2,<4",
]
anthropic = [
    "anthropic>=0.99,<1",
]
bigquery = [
    "google-cloud-bigquery>=3.38,<4",
    "google-cloud-bigquery-storage>=2.39,<3",
]
s3 = [
    "boto3>=1.39,<2",
    "pyarrow>=18.0,<25",
    "orjson>=3.11,<4",
]
all = [
    "agora-etl-plugins[redis,cron,distributed,kafka,postgres,anthropic,bigquery,s3]",
]
dev = [
    "agora-etl[dev,file]",
]

# ======================================================================
# Plugin entry-point groups — auto-discovered by agora-etl at runtime
# ======================================================================

[project.entry-points."agora.sources"]
redis_stream = "agora_plugins.redis.sources.redis:RedisStreamSource"
redis_dlq_source = "agora_plugins.redis.dlq:RedisDLQSource"
kafka = "agora_plugins.kafka.sources.kafka:KafkaSource"
kafka_dlq_source = "agora_plugins.kafka.dlq:KafkaDLQSource"
postgres = "agora_plugins.postgres.sources.postgres:PostgresSource"
postgres_dlq_source = "agora_plugins.postgres.dlq:PostgresDLQSource"
bigquery = "agora_plugins.bigquery.sources.bigquery:BigQuerySource"
s3 = "agora_plugins.s3.sources.s3:S3Source"

[project.entry-points."agora.sinks"]
redis = "agora_plugins.redis.sinks.redis:RedisSink"
redis_dlq = "agora_plugins.redis.dlq:RedisDLQSink"
kafka = "agora_plugins.kafka.sinks.kafka:KafkaSink"
kafka_dlq = "agora_plugins.kafka.dlq:KafkaDLQSink"
postgres = "agora_plugins.postgres.sinks.postgres:PostgresSink"
postgres_schema_adapter = "agora_plugins.postgres.sinks.postgres:PostgresSchemaAdapter"
postgres_dlq = "agora_plugins.postgres.dlq:PostgresDLQSink"
bigquery = "agora_plugins.bigquery.sinks.bigquery:BigQuerySink"
bigquery_storage_write = "agora_plugins.bigquery.sinks.storage_write:BigQueryStorageWriteSink"
s3 = "agora_plugins.s3.sinks.s3:S3Sink"

[project.entry-points."agora.ai.caches"]
redis = "agora_plugins.redis.ai.cache:RedisLLMCache"

[project.entry-points."agora.ai.providers"]
anthropic = "agora_plugins.anthropic:AnthropicProvider"

[project.entry-points."agora.middlewares.dedup.stores"]
redis = "agora_plugins.redis.dedup.stores.redis:RedisStore"
redis_embedding = "agora_plugins.redis.dedup.stores.embedding:RedisEmbeddingStore"

[project.entry-points."agora.state.backends"]
redis = "agora_plugins.redis.state.redis:RedisBackend"

[project.entry-points."agora.doctor.readiness"]
kafka = "agora_plugins.kafka.doctor:DOCTOR_READINESS_PROVIDER"
postgres = "agora_plugins.postgres.doctor:DOCTOR_READINESS_PROVIDER"
redis = "agora_plugins.redis.doctor:DOCTOR_READINESS_PROVIDER"

[tool.hatch.build.targets.wheel]
packages = ["src/agora_plugins"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "TCH", "TRY", "G", "PIE", "RET", "RUF"]
ignore = ["E501", "TRY003", "TRY300", "TRY301", "RET504"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires external services such as Kafka, Postgres, or Redis",
]

[tool.coverage.run]
source = ["src/agora_plugins"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "agora_plugins.anthropic.*",
    "agora_plugins.bigquery.*",
    "agora_plugins.distributed.*",
    "agora_plugins.dlq_policy",
    "agora_plugins.kafka.*",
    "agora_plugins.postgres.*",
    "agora_plugins.redis.*",
]
ignore_errors = true
