services:
  redis-stack:
    image: redis/redis-stack-server:7.2.0-v14
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --protected-mode no --bind 0.0.0.0"
    ports:
      - "16388:6379"
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  redis_stack_data:
